# ─────────────────────────────────────────────
# WHITEBOX HYPRLOCK
# ─────────────────────────────────────────────

general {
    hide_cursor = true
}


# ─────────────────────────────────────────────
# BACKGROUND
# ─────────────────────────────────────────────

background {
    monitor =

    path = $HOME/.local/state/whitebox/hyprlock-wallpaper

    blur_passes = 3
    blur_size = 8

    brightness = 0.68
    contrast = 1.05
    vibrancy = 0.12
    vibrancy_darkness = 0.0
}


# ─────────────────────────────────────────────
# CLOCK
# ─────────────────────────────────────────────

label {
    monitor =

    text = $TIME

    color = rgb(c6d0f5)

    font_size = 72
    font_family = sans-serif

    position = 0, 250

    halign = center
    valign = center
}


# ─────────────────────────────────────────────
# DATE
# ─────────────────────────────────────────────

label {
    monitor =

    text = cmd[update:1000] date +"%A, %B %d"

    color = rgb(b5bfe2)

    font_size = 18
    font_family = sans-serif

    position = 0, 180

    halign = center
    valign = center
}


# ─────────────────────────────────────────────
# USERNAME
# ─────────────────────────────────────────────

label {
    monitor =

    text = cmd[update:1000] echo $USER

    color = rgb(c6d0f5)

    font_size = 20
    font_family = sans-serif

    position = 0, -35

    halign = center
    valign = center
}


# ─────────────────────────────────────────────
# PASSWORD
# ─────────────────────────────────────────────

input-field {
    monitor =

    size = 300, 42

    outline_thickness = 1

    outer_color = rgb(737994)
    inner_color = rgba(303446dd)

    font_color = rgb(c6d0f5)

    check_color = rgb(a6d189)
    fail_color = rgb(e78284)

    placeholder_text = <span foreground="##838ba7">Password</span>

    fail_text = <span foreground="##e78284">Authentication failed</span>

    dots_size = 0.18
    dots_spacing = 0.30
    dots_center = true

    fade_on_empty = false

    rounding = 10

    position = 0, -105

    halign = center
    valign = center
}
