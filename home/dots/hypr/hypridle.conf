# ─────────────────────────────────────────────
# WHITEBOX HYPRIDLE
# ─────────────────────────────────────────────

general {
    # Launch Hyprlock whenever logind requests a session lock.
    lock_cmd = pgrep -x hyprlock || hyprlock

    # Any suspend path, including the Quickshell Sleep button,
    # locks the session before the machine actually sleeps.
    before_sleep_cmd = loginctl lock-session

    # Wait for the Wayland session to be locked before sleeping.
    inhibit_sleep = 3

    # Respect applications that deliberately inhibit idle.
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# 5 minutes idle -> lock
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 15 minutes idle -> suspend
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
